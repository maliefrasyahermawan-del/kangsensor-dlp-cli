rules:
  - id: CRED_AWS_ACCESS_KEY
    name: "AWS Access Key ID"
    severity: CRITICAL
    pattern: '\b(AKIA|ASIA|AROA|AIPA|ANPA|ANVA|APKA)[A-Z0-9]{16}\b'
    confidence_base: 95
    min_confidence: 80
    description: AWS IAM access key identifiers (all prefixes).

  - id: CRED_AWS_SECRET_KEY
    name: "AWS Secret Access Key"
    severity: CRITICAL
    pattern: '(?i)(?:aws_secret|secret_access_key|aws_secret_key)[^=\n]*[=:]\s*["''"]?([A-Za-z0-9/+]{40})["''"]?'
    confidence_base: 90
    min_confidence: 70

  - id: CRED_PRIVATE_KEY
    name: "PEM Private Key"
    severity: CRITICAL
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    confidence_base: 99
    min_confidence: 90
    description: Matches PEM-encoded private key headers.

  - id: CRED_GITHUB_TOKEN
    name: "GitHub Personal Access Token"
    severity: CRITICAL
    pattern: '\bghp_[A-Za-z0-9]{36}\b|\bgho_[A-Za-z0-9]{36}\b|\bghu_[A-Za-z0-9]{36}\b|\bghs_[A-Za-z0-9]{36}\b'
    confidence_base: 95
    min_confidence: 85

  - id: CRED_GOOGLE_API_KEY
    name: "Google API Key"
    severity: CRITICAL
    pattern: '\bAIza[0-9A-Za-z\-_]{35}\b'
    confidence_base: 95
    min_confidence: 80

  - id: CRED_SLACK_TOKEN
    name: "Slack API Token"
    severity: CRITICAL
    pattern: '\bxox[baprs]-[0-9A-Za-z\-]{10,72}\b'
    confidence_base: 95
    min_confidence: 80

  - id: CRED_JWT
    name: "JSON Web Token"
    severity: HIGH
    pattern: '\beyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\b'
    confidence_base: 85
    min_confidence: 70
    description: Base64url encoded JWT (header.payload.signature).

  - id: CRED_GENERIC_SECRET
    name: "Generic Secret / Password Assignment"
    severity: HIGH
    pattern: '(?i)(?:password|passwd|secret|api_key|apikey|token|auth_token)\s*[=:]\s*["''"]?[A-Za-z0-9@#$%^&*()_+\-=]{8,64}["''"]?'
    validators:
      - type: not_placeholder
        placeholders: ["example", "changeme", "your_password", "xxx", "placeholder", "todo"]
    confidence_base: 60
    min_confidence: 50

  - id: CRED_DB_CONN_STRING
    name: "Database Connection String"
    severity: HIGH
    pattern: '(?i)(?:mysql|postgresql|postgres|mongodb|redis|mssql)://[^\s"''<>]+'
    confidence_base: 85
    min_confidence: 70
